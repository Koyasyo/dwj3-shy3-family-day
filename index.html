<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DWJ3 × SHY3 Family Day｜2026.9.12</title>
<meta name="description" content="DWJ3 × SHY3 Family Day 2026年9月12日(土) 開催">
<meta name="theme-color" content="#3fa4e0">
<meta property="og:title" content="DWJ3 × SHY3 Family Day">
<meta property="og:description" content="2026年9月12日(土) 開催">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Kaisei+Decol:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  /* 真夏の青空パレット */
  --sky-top:#1f8fe0;
  --sky-mid:#4bb4ea;
  --sky-low:#9adcf3;
  --sky-haze:#e7f7fd;
  --sun:#ffd94f;
  --sun-core:#fff3c4;
  --shu:#e0472e;      /* 提灯・見出しの朱赤 */
  --shu-dk:#b8331e;
  --navy:#173b66;      /* ロゴと同系の紺 */
  --box:#e8a34a;       /* Amazon段ボール */
  --box-dk:#c07f2a;
  --tape:#2f6a63;
  --ai-900:#0a1e42;--ai-800:#123253;--ai-600:#1d5e9e;--ai-400:#3f9bd4;--ai-200:#a9dcf2;
  --kin:#f3c14b;
  --paper:#fffdf7;
  --ink:#13233d;
  --body:"Zen Kaku Gothic New",'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;
  --disp:"Kaisei Decol","Zen Kaku Gothic New",serif;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:var(--body);
  color:var(--paper);
  background:var(--sky-haze);
  min-height:100svh;
  overflow-x:hidden;
  line-height:1.7;
}
.page{
  position:relative;
  overflow:hidden;
  min-height:min(100svh,780px);
  background:
    radial-gradient(120% 60% at 50% 0%, #1b4b86 0%, transparent 62%),
    linear-gradient(180deg,var(--ai-900) 0%,var(--ai-800) 22%,var(--ai-600) 52%,var(--ai-400) 80%,var(--ai-200) 100%);
}

/* ── 太陽と雲 ─────────────────────────── */
.sky{position:absolute;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.hanabi{position:absolute;width:5px;height:5px;border-radius:50%;opacity:0;
  animation:burst 7s cubic-bezier(.16,.84,.44,1) infinite}
.hanabi.a{left:14%;top:12%;animation-delay:.6s}
.hanabi.b{left:80%;top:8%;animation-delay:3.1s}
.hanabi.c{left:50%;top:20%;animation-delay:5.2s;transform:scale(.62)}
@keyframes burst{0%{opacity:0;transform:scale(.05)}6%{opacity:1}60%{opacity:.85}100%{opacity:0;transform:scale(1.9)}}
.hanabi::before{content:"";position:absolute;inset:0;border-radius:50%;
  box-shadow:
   0 -74px 0 0 var(--kin), 37px -64px 0 0 #fff, 64px -37px 0 0 var(--ai-200),
   74px 0 0 0 var(--kin), 64px 37px 0 0 #fff, 37px 64px 0 0 var(--ai-200),
   0 74px 0 0 var(--kin), -37px 64px 0 0 #fff, -64px 37px 0 0 var(--ai-200),
   -74px 0 0 0 var(--kin), -64px -37px 0 0 #fff, -37px -64px 0 0 var(--ai-200),
   0 -44px 0 0 #fff, 31px -31px 0 0 var(--kin), 44px 0 0 0 #fff,
   31px 31px 0 0 var(--kin), 0 44px 0 0 #fff, -31px 31px 0 0 var(--kin),
   -44px 0 0 0 #fff, -31px -31px 0 0 var(--kin);}
.hanabi.b::before{filter:hue-rotate(-18deg)}
.star{position:absolute;width:2px;height:2px;background:#fff;border-radius:50%;opacity:.55;
  animation:twinkle 4s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.15}50%{opacity:.75}}

/* ── 提灯（朱×白） ───────────────────────── */
.chochin-line{position:relative;z-index:2;height:clamp(66px,16vw,98px);opacity:0;animation:dropIn 1s cubic-bezier(.2,.9,.3,1) .05s forwards}
@keyframes dropIn{from{opacity:0;transform:translateY(-44px)}to{opacity:1;transform:none}}
.chochin-line svg{position:absolute;left:-4%;right:-4%;top:10px;width:108%;height:26px}
.chochin-line ul{display:flex;justify-content:center;gap:clamp(16px,5.5vw,42px);
  margin:0;padding:0;list-style:none;position:relative;top:6px}
.chochin{width:clamp(24px,7vw,36px);height:clamp(34px,9.6vw,48px);
  border-radius:48% 48% 44% 44%/40% 40% 44% 44%;
  position:relative;transform-origin:50% -16px;
  background:
    repeating-linear-gradient(90deg,rgba(255,255,255,.9) 0 3px,var(--shu) 3px 9px),
    radial-gradient(65% 55% at 30% 26%,rgba(255,255,255,.55),transparent 60%);
  box-shadow:0 3px 10px rgba(20,40,70,.25), inset 0 -5px 8px rgba(0,0,0,.14);
  animation:sway 5.2s ease-in-out infinite}
.chochin::before,.chochin::after{content:"";position:absolute;left:24%;right:24%;height:3px;
  background:#1c2e46;border-radius:2px}
.chochin::before{top:-2px}
.chochin::after{bottom:-2px}
.chochin:nth-child(2){animation-delay:-1.1s}
.chochin:nth-child(3){animation-delay:-2.3s}
.chochin:nth-child(4){animation-delay:-.5s}
.chochin:nth-child(5){animation-delay:-3.1s}
@keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}

/* ── 本体 ───────────────────────────────── */
main{position:relative;z-index:2;max-width:min(700px,92vw);margin:0 auto;
  padding:clamp(6px,1.4vw,12px) 0 clamp(30px,7vw,54px)}
.reveal{opacity:0;transform:translateY(18px);
  animation:rise .9s cubic-bezier(.2,.9,.25,1) forwards}
@keyframes rise{to{opacity:1;transform:none}}
@keyframes riseUp{from{opacity:0;transform:translateY(34px)}to{opacity:1;transform:none}}
.d1{animation-delay:.1s}.d2{animation-delay:.28s}.d3{animation-delay:.46s}
.d4{animation-delay:.64s}.d5{animation-delay:.85s}

.crest{display:flex;align-items:center;justify-content:center;
  gap:clamp(8px,3.2vw,18px);margin-bottom:clamp(18px,4.6vw,26px)}
.crest img{display:block;height:clamp(48px,13.5vw,76px);width:auto;
  filter:drop-shadow(0 5px 14px rgba(10,40,70,.3))}
.crest .bat{font-family:var(--disp);font-weight:700;font-size:clamp(18px,5vw,28px);
  color:#fff;line-height:1;text-shadow:0 2px 6px rgba(10,40,70,.35)}

/* Amazon風の吹き出し矢印 */
.smile{display:inline-block;width:.62em;height:.34em;margin:0 .06em -.05em;
  border-bottom:3px solid currentColor;border-radius:0 0 60% 60%/0 0 100% 100%}

h1{margin:clamp(14px,4vw,22px) 0 0;text-align:center;line-height:1.06}
h1 .ln2{display:block;font-family:var(--disp);font-weight:700;
  font-size:clamp(46px,13.4vw,92px);letter-spacing:.02em;color:var(--shu);
  -webkit-text-stroke:clamp(3px,.9vw,7px) #fff;
  paint-order:stroke fill;
  filter:drop-shadow(0 6px 0 var(--shu-dk)) drop-shadow(0 14px 18px rgba(10,40,70,.35))}

/* ── 日付バンド ──────────────────────────── */
.date-band{position:relative;margin:clamp(22px,6vw,34px) auto 0;width:fit-content;
  padding:clamp(10px,2.6vw,14px) clamp(22px,6vw,32px);text-align:center;color:#fff;
  background:rgba(255,255,255,.1);
  border:2px solid rgba(243,193,75,.55);
  border-radius:100px;backdrop-filter:blur(1px)}
.date-band .yr{display:block;font-weight:500;letter-spacing:.4em;text-indent:.4em;
  font-size:clamp(11px,3vw,13px);color:var(--ai-200);margin-bottom:.3em;opacity:.95}
.date-band .big{display:flex;align-items:baseline;justify-content:center;gap:.02em;
  font-family:var(--disp);font-weight:700;line-height:.92;
  font-size:clamp(50px,15.4vw,92px);color:#fff;
  text-shadow:0 4px 18px rgba(4,16,38,.5)}
.date-band .big .dot{font-size:.5em;transform:translateY(-.06em);margin:0 .06em;color:var(--kin)}
.date-band .dow{display:block;font-weight:700;color:var(--kin);
  font-size:clamp(12px,3.2vw,15px);letter-spacing:.34em;text-indent:.34em;margin-top:.4em}

/* ── 中央の写真 ──────────────────────────── */
.photo-wrap{margin:clamp(30px,8vw,52px) auto 0;position:relative;width:100%}
.photo-wrap::before{content:"";position:absolute;inset:-14px -10px;border-radius:4px;
  background:radial-gradient(60% 50% at 50% 40%,rgba(255,255,255,.22),transparent 70%);
  filter:blur(6px)}
figure.photo{position:relative;margin:0;background:var(--paper);
  padding:clamp(10px,2.8vw,14px) clamp(10px,2.8vw,14px) clamp(36px,8.6vw,48px);
  border-radius:3px;transform:rotate(-1.1deg);
  box-shadow:0 20px 40px -16px rgba(10,40,70,.5),0 2px 0 rgba(255,255,255,.5) inset;
  transition:transform .6s cubic-bezier(.2,.9,.25,1)}
figure.photo:hover{transform:rotate(0deg) translateY(-3px)}
.frame{position:relative;aspect-ratio:4/3;overflow:hidden;background:#e7eef4;border-radius:1px}
.frame img{width:100%;height:100%;object-fit:cover;display:block}
.frame img[hidden]{display:none}
.ph{position:absolute;inset:0;display:grid;place-content:center;gap:10px;
  text-align:center;color:#3f7aa8;
  background:
    repeating-linear-gradient(45deg,rgba(63,155,212,.08) 0 10px,transparent 10px 20px),
    linear-gradient(180deg,#f2f9fd,#dcf0f8);
  border:1.5px dashed rgba(31,143,224,.4);border-radius:1px}
.ph .cs{margin:0;font-family:var(--disp);font-weight:700;color:var(--sky-top);
  font-size:clamp(24px,7vw,36px);letter-spacing:.04em;line-height:1.1}
.ph .cs-sub{font-size:clamp(11px,3vw,12.5px);letter-spacing:.22em;color:#6d97b8;font-weight:500}
figcaption{position:absolute;left:0;right:0;bottom:clamp(11px,2.6vw,15px);
  text-align:center;font-family:var(--disp);font-weight:700;color:var(--navy);
  font-size:clamp(11px,3vw,13px);letter-spacing:.16em}
.frame::after{content:"";position:absolute;inset:6px;pointer-events:none;
  background:
    linear-gradient(#fff,#fff) left 0 top 0/14px 1.5px no-repeat,
    linear-gradient(#fff,#fff) left 0 top 0/1.5px 14px no-repeat,
    linear-gradient(#fff,#fff) right 0 bottom 0/14px 1.5px no-repeat,
    linear-gradient(#fff,#fff) right 0 bottom 0/1.5px 14px no-repeat;
  opacity:.75}

/* ── フッター帯：段ボール＋タワー＆お城シルエット ───── */
.skyline{position:relative;z-index:1;line-height:0;margin-top:clamp(-8px,-1.6vw,0);opacity:0;animation:riseUp 1.1s cubic-bezier(.2,.85,.25,1) 1.05s forwards;
  background:linear-gradient(180deg,var(--ai-200) 0%,#cdeaf7 55%,#eef8fd 100%)}
.skyline svg{display:block;width:100%;height:clamp(96px,24vw,150px)}

/* 大阪城・通天閣：ヒーロー左右の縁に固定表示（画面幅に関係なく必ず見える） */
.landmark{position:absolute;z-index:1;pointer-events:none;
  filter:drop-shadow(0 8px 14px rgba(4,18,40,.45))}
.landmark svg,.landmark img{display:block;height:100%;width:auto;
  -webkit-mask-image:linear-gradient(180deg,#000 0,#000 82%,transparent 100%);
  mask-image:linear-gradient(180deg,#000 0,#000 82%,transparent 100%)}
.landmark.castle{opacity:0;animation:slideL 1.15s cubic-bezier(.2,.85,.25,1) .5s forwards}
.landmark.tower{opacity:0;animation:slideR 1.15s cubic-bezier(.2,.85,.25,1) .62s forwards}
@keyframes slideL{from{opacity:0;transform:translateX(-46px)}to{opacity:1;transform:none}}
@keyframes slideR{from{opacity:0;transform:translateX(46px)}to{opacity:1;transform:none}}
.landmark.castle{left:clamp(-14px,-3vw,-4px);top:clamp(200px,52vw,340px);
  height:clamp(120px,30vw,200px)}
.landmark.tower{right:clamp(-10px,-2vw,-2px);top:clamp(180px,46vw,300px);
  height:clamp(150px,36vw,240px)}
footer{position:relative;z-index:2;background:var(--paper);color:var(--navy);
  text-align:center;padding:clamp(16px,4.6vw,22px) 16px calc(clamp(18px,4.6vw,24px) + env(safe-area-inset-bottom));
  font-size:clamp(11px,3vw,12.5px);letter-spacing:.08em;font-weight:500}
footer .sep{display:inline-block;margin:0 .7em;color:var(--sky-top)}

@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
  .reveal,.landmark,.chochin-line,.skyline{opacity:1!important;transform:none!important}
}
</style>
</head>

<div class="sky" aria-hidden="true">
