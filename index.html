<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DWJ3 × SHY3 Family Day｜2026.9.12</title>
<meta name="description" content="DWJ3 × SHY3 Family Day 2026年9月12日(土) 開催">
<meta name="theme-color" content="#0f2f5e">
<meta property="og:title" content="DWJ3 × SHY3 Family Day">
<meta property="og:description" content="2026年9月12日(土) 開催">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Zen+Antique+Soft&display=swap" rel="stylesheet">
<style>
:root{
  /* 藍(indigo) → 空色 → 白波 の夏祭り薄暮パレット */
  --ai-900:#0a1e42;
  --ai-800:#123253;
  --ai-600:#1d5e9e;
  --ai-400:#3f9bd4;
  --ai-200:#a9dcf2;
  --foam:#eef8fd;
  --paper:#fbfaf6;
  --ink:#13233d;
  --shu:#e8613c;     /* 提灯の朱 */
  --kin:#f3c14b;     /* 金 */
  --sumi:rgba(10,30,66,.14);
  --disp:"Shippori Mincho B1",'Hiragino Mincho ProN','Yu Mincho',serif;
  --body:"Zen Kaku Gothic New",'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;
  --acc:"Zen Antique Soft",var(--disp);
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:var(--body);
  color:var(--foam);
  background:var(--foam);
  min-height:100svh;
  overflow-x:hidden;
  line-height:1.75;
}
/* 夜空のグラデーションはコンテンツ高さに追従させる（画面高固定だと下に白い余白が割れる） */
.page{
  position:relative;
  overflow:hidden;
  min-height:min(100svh,760px);
  background:
    radial-gradient(120% 60% at 50% 0%, #1b4b86 0%, transparent 62%),
    linear-gradient(180deg,var(--ai-900) 0%,var(--ai-800) 20%,var(--ai-600) 50%,var(--ai-400) 76%,var(--ai-200) 100%);
}

/* ── 花火 ───────────────────────────────── */
.sky{position:absolute;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.hanabi{position:absolute;width:5px;height:5px;border-radius:50%;opacity:0;
  animation:burst 7s cubic-bezier(.16,.84,.44,1) infinite}
.hanabi.a{left:16%;top:14%;animation-delay:.6s}
.hanabi.b{left:78%;top:9%;animation-delay:3.1s}
.hanabi.c{left:47%;top:22%;animation-delay:5.2s;transform:scale(.62)}
@keyframes burst{
  0%{opacity:0;transform:scale(.05)}
  6%{opacity:1}
  60%{opacity:.85}
  100%{opacity:0;transform:scale(1.9)}
}
/* 粒は box-shadow で放射状に配置（要素1つで24粒） */
.hanabi::before{content:"";position:absolute;inset:0;border-radius:50%;
  box-shadow:
   0 -74px 0 0 var(--kin), 37px -64px 0 0 #fff, 64px -37px 0 0 var(--ai-200),
   74px 0 0 0 var(--kin), 64px 37px 0 0 #fff, 37px 64px 0 0 var(--ai-200),
   0 74px 0 0 var(--kin), -37px 64px 0 0 #fff, -64px 37px 0 0 var(--ai-200),
   -74px 0 0 0 var(--kin), -64px -37px 0 0 #fff, -37px -64px 0 0 var(--ai-200),
   0 -44px 0 0 #fff, 31px -31px 0 0 var(--kin), 44px 0 0 0 #fff,
   31px 31px 0 0 var(--kin), 0 44px 0 0 #fff, -31px 31px 0 0 var(--kin),
   -44px 0 0 0 #fff, -31px -31px 0 0 var(--kin);
}
.hanabi.b::before{filter:hue-rotate(-18deg)}
.hoshi{position:absolute;width:2px;height:2px;background:#fff;border-radius:50%;opacity:.55;
  animation:twinkle 4s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.15}50%{opacity:.75}}

/* ── 提灯 ───────────────────────────────── */
.chochin-line{position:relative;z-index:2;height:clamp(72px,17vw,104px)}
.chochin-line::before{content:"";position:absolute;left:-4%;right:-4%;top:14px;height:2px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.5) 12%,rgba(255,255,255,.5) 88%,transparent);
  border-radius:2px;
  transform:rotate(-.6deg)}
.chochin-line ul{display:flex;justify-content:center;gap:clamp(14px,5vw,38px);
  margin:0;padding:0;list-style:none;position:relative}
.chochin{width:clamp(26px,7.5vw,38px);height:clamp(38px,10.5vw,54px);
  border-radius:46% 46% 44% 44%/38% 38% 42% 42%;
  position:relative;transform-origin:50% -18px;
  background:
    repeating-linear-gradient(90deg,rgba(0,0,0,.07) 0 1px,transparent 1px 7px),
    radial-gradient(70% 60% at 32% 28%,rgba(255,255,255,.75),transparent 62%),
    linear-gradient(180deg,#f6a24f,var(--shu));
  box-shadow:0 0 22px rgba(243,193,75,.5), inset 0 -6px 10px rgba(0,0,0,.16);
  animation:sway 5.5s ease-in-out infinite}
.chochin::before,.chochin::after{content:"";position:absolute;left:22%;right:22%;height:4px;
  background:#20304d;border-radius:2px}
.chochin::before{top:-3px}
.chochin::after{bottom:-3px}
.chochin:nth-child(2){animation-delay:-1.1s;background:
    repeating-linear-gradient(90deg,rgba(0,0,0,.06) 0 1px,transparent 1px 7px),
    radial-gradient(70% 60% at 32% 28%,rgba(255,255,255,.85),transparent 62%),
    linear-gradient(180deg,#fff6e2,var(--kin));box-shadow:0 0 24px rgba(255,244,214,.6),inset 0 -6px 10px rgba(0,0,0,.12)}
.chochin:nth-child(3){animation-delay:-2.4s}
.chochin:nth-child(4){animation-delay:-.5s;background:
    repeating-linear-gradient(90deg,rgba(0,0,0,.06) 0 1px,transparent 1px 7px),
    radial-gradient(70% 60% at 32% 28%,rgba(255,255,255,.85),transparent 62%),
    linear-gradient(180deg,#eaf7ff,#7fc8ea);box-shadow:0 0 22px rgba(169,220,242,.6),inset 0 -6px 10px rgba(0,0,0,.1)}
.chochin:nth-child(5){animation-delay:-3.2s}
@keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}

/* ── 本体 ───────────────────────────────── */
main{position:relative;z-index:2;max-width:min(680px,92vw);margin:0 auto;
  padding:clamp(4px,1vw,10px) 0 clamp(40px,10vw,72px)}
.reveal{opacity:0;transform:translateY(18px);
  animation:rise .9s cubic-bezier(.2,.9,.25,1) forwards}
@keyframes rise{to{opacity:1;transform:none}}
.d1{animation-delay:.15s}.d2{animation-delay:.35s}.d3{animation-delay:.55s}
.d4{animation-delay:.75s}.d5{animation-delay:.95s}

.kicker{display:flex;align-items:center;justify-content:center;gap:12px;
  font-family:var(--body);font-weight:500;letter-spacing:.42em;text-indent:.42em;
  font-size:clamp(10px,2.8vw,12px);color:var(--kin);margin:0 0 clamp(16px,4vw,24px)}
.kicker::before,.kicker::after{content:"";height:1px;width:clamp(24px,8vw,56px);
  background:linear-gradient(90deg,transparent,var(--kin))}
.kicker::after{background:linear-gradient(270deg,transparent,var(--kin))}

.crest{display:flex;align-items:center;justify-content:center;
  gap:clamp(8px,3.4vw,20px);margin-bottom:clamp(20px,5vw,30px)}
.crest img{display:block;height:clamp(46px,13vw,74px);width:auto;
  filter:drop-shadow(0 6px 16px rgba(4,16,38,.45))}
.crest .bat{font-family:var(--acc);font-size:clamp(17px,5vw,26px);color:var(--kin);
  line-height:1;transform:translateY(1px)}

h1{margin:0;text-align:center;font-family:var(--disp);font-weight:800;
  line-height:1.14;letter-spacing:.06em;
  font-size:clamp(40px,12.4vw,78px);
  text-shadow:0 4px 30px rgba(4,16,38,.5)}
h1 .ttl-en{display:block;font-family:var(--acc);font-weight:400;
  font-size:clamp(30px,10vw,62px);letter-spacing:.04em;
  color:#fff;margin-top:.1em}
h1 .ttl-en em{font-style:normal;color:var(--kin)}

/* 日付：祭りの立て看板のように大きく1つだけ見せる */
.date-band{position:relative;margin:clamp(26px,7vw,40px) auto 0;width:fit-content;
  padding:clamp(10px,2.6vw,14px) clamp(6px,2vw,14px);text-align:center;color:var(--paper)}
.date-band::before,.date-band::after{content:"";position:absolute;left:0;right:0;height:3px;
  background:linear-gradient(90deg,transparent,var(--kin) 18%,var(--kin) 82%,transparent);
  opacity:.9}
.date-band::before{top:0;box-shadow:0 5px 0 -3.5px rgba(243,193,75,.55)}
.date-band::after{bottom:0;box-shadow:0 -5px 0 -3.5px rgba(243,193,75,.55)}
.date-band .yr{display:block;font-family:var(--acc);letter-spacing:.5em;text-indent:.5em;
  font-size:clamp(11px,3vw,13px);color:var(--ai-200);margin-bottom:.35em}
.date-band .big{display:flex;align-items:baseline;justify-content:center;gap:.02em;
  font-family:var(--disp);font-weight:800;line-height:.92;
  font-size:clamp(62px,21vw,124px);letter-spacing:-.01em;
  text-shadow:0 6px 30px rgba(4,16,38,.5)}
.date-band .big .dot{color:var(--kin);font-size:.5em;transform:translateY(-.06em);margin:0 .04em}
.date-band .dow{display:block;font-family:var(--acc);color:var(--kin);
  font-size:clamp(11px,3vw,13.5px);letter-spacing:.42em;text-indent:.42em;margin-top:.5em}
/* 朱の判子 */
.seal{position:absolute;right:clamp(-34px,-9vw,-52px);top:clamp(-6px,-2vw,-14px);
  width:clamp(46px,12.5vw,68px);aspect-ratio:1;border-radius:50%;
  display:grid;place-content:center;transform:rotate(-9deg);
  background:var(--shu);color:#fff5ec;
  font-family:var(--disp);font-weight:800;font-size:clamp(20px,5.6vw,30px);
  border:2.5px solid rgba(255,245,236,.85);
  box-shadow:0 6px 18px rgba(120,30,10,.45)}

/* ── 中央の写真 ──────────────────────────── */
.photo-wrap{margin:clamp(34px,9vw,58px) auto 0;position:relative;width:100%}
.photo-wrap::before{content:"";position:absolute;inset:-14px -10px;border-radius:4px;
  background:radial-gradient(60% 50% at 50% 40%,rgba(255,255,255,.16),transparent 70%);
  filter:blur(6px)}
figure.photo{position:relative;margin:0;background:var(--paper);
  padding:clamp(10px,2.8vw,14px) clamp(10px,2.8vw,14px) clamp(38px,9vw,50px);
  border-radius:3px;transform:rotate(-1.1deg);
  box-shadow:0 22px 44px -18px rgba(4,16,38,.6),0 2px 0 rgba(255,255,255,.5) inset;
  transition:transform .6s cubic-bezier(.2,.9,.25,1)}
figure.photo:hover{transform:rotate(0deg) translateY(-3px)}
.frame{position:relative;aspect-ratio:4/3;overflow:hidden;background:#e7eef4;
  border-radius:1px}
.frame img{width:100%;height:100%;object-fit:cover;display:block}
.frame img[hidden]{display:none}
.ph{position:absolute;inset:0;display:grid;place-content:center;gap:10px;
  text-align:center;color:#4a678b;
  background:
    repeating-linear-gradient(45deg,rgba(63,155,212,.07) 0 10px,transparent 10px 20px),
    linear-gradient(180deg,#f2f7fb,#dfeaf3);
  border:1.5px dashed rgba(29,94,158,.4);border-radius:1px}
.ph .cs{margin:0;font-family:var(--acc);color:#5b83ab;
  font-size:clamp(26px,7.6vw,40px);letter-spacing:.06em;line-height:1.1}
.ph .cs-sub{font-size:clamp(11px,3vw,12.5px);letter-spacing:.22em;color:#7c95b1;font-weight:500}
figcaption{position:absolute;left:0;right:0;bottom:clamp(11px,2.6vw,15px);
  text-align:center;font-family:var(--disp);font-weight:600;color:#2b4a72;
  font-size:clamp(11px,3vw,13px);letter-spacing:.16em}
/* 写真の四隅マーク */
.frame::after{content:"";position:absolute;inset:6px;pointer-events:none;
  background:
    linear-gradient(#fff,#fff) left 0 top 0/14px 1.5px no-repeat,
    linear-gradient(#fff,#fff) left 0 top 0/1.5px 14px no-repeat,
    linear-gradient(#fff,#fff) right 0 bottom 0/14px 1.5px no-repeat,
    linear-gradient(#fff,#fff) right 0 bottom 0/1.5px 14px no-repeat;
  opacity:.75}

/* ── 波（青海波） ────────────────────────── */
.nami{position:relative;z-index:1;margin-top:clamp(-10px,-2vw,0px);line-height:0}
.nami svg{display:block;width:100%;height:clamp(64px,17vw,110px)}
footer{position:relative;z-index:2;background:var(--foam);color:#3c5c80;
  text-align:center;padding:clamp(18px,5vw,26px) 16px calc(clamp(20px,5vw,28px) + env(safe-area-inset-bottom));
  font-size:clamp(11px,3vw,12.5px);letter-spacing:.1em}
footer .sep{display:inline-block;margin:0 .7em;color:var(--ai-400)}

@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
  .reveal{opacity:1;transform:none}
  .hanabi{display:none}
}
</style>
</head>
<body>

<div class="page">
<div class="sky" aria-hidden="true">
  <span class="hanabi a"></span><span class="hanabi b"></span><span class="hanabi c"></span>

  <span class="hoshi" style="left:26%;top:7%;animation-delay:1.2s"></span>
  <span class="hoshi" style="left:58%;top:16%;animation-delay:2.1s"></span>
  <span class="hoshi" style="left:88%;top:26%;animation-delay:.6s"></span>
  <span class="hoshi" style="left:70%;top:38%;animation-delay:2.8s"></span>

</div>

<div class="chochin-line" aria-hidden="true">

    <li class="chochin"></li><li class="chochin"></li><li class="chochin"></li>
